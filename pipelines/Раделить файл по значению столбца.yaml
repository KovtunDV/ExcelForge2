pipeline_version: 1
name: Раделить файл по значению столбца
description: Разделяет общий файл на отдельные файлы по значению поля - в примере
  по типу оборудования. Вариант фиксированным путем для загрузки
steps:
- id: globals_settings_1
  type: globals_settings
  params:
    values:
      directory: C:/Users/kovtu.CODER/ExcelForge2/pipelines/Demo_data
    directory_open_dialog: false
    directory_var: directory
    directory_open_dialog_help: Выберите каталог
    directory_initial: C:/Users/kovtu.CODER/ExcelForge2/pipelines/Demo_data
    file_open_dialog: false
    file_var: file_path
    file_open_dialog_help: Выберите файл
    filetypes:
    - - All files
      - '*.*'
- id: load_excel_1
  type: load_excel
  params:
    input_mode: file
    directory: ''
    pattern: '*.xlsx'
    recursive: false
    file_path: '@directory/Данные для разделения.xlsx'
    sheet: 0
    header_mode: first_row
    start_row: 1
    usecols: ''
    dataframe: df_main
    dtype: str
- id: save_excel_1
  type: save_excel
  params:
    source_df: df_main
    out_dir: '@directory/Output_data'
    filename: null
    columns: []
    template_path: ''
    template_column_map: {}
    sheet_name: Sheet1
    start_row: 1
    start_col: 1
    split_by_column: Тип оборудования
    split_filename_mask: out_{group}.xlsx
