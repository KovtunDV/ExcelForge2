    pattern: '*.*'
    patterns: []
    recursive: false
    include_dirs: []
    exclude_dirs: []
    dest_dir: C:/Users/kovtu.CODER/ExcelForge2/pipelines/Demo_data/Temp
    dest_path: ''
    dest_name: ''
    filename: ''
    prefix: ''
