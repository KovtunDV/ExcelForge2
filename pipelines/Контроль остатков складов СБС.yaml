pipeline_version: 1
name: Контроль остатков складов СБС
description: тест
steps:
- id: globals_settings_1
  type: globals_settings
  params:
    values:
      directory_work: C:/Users/kovtu.CODER/ExcelForge/Контроль остаткоа складов
      directory_sbs: C:/Users/kovtu.CODER/ExcelForge/Контроль остаткоа складов/Данные
        СБС
      directory_out: C:/Users/kovtu.CODER/ExcelForge/Контроль остаткоа складов/Результат
      file_name_out: Отчет_для_контроля_остатков_склада2.xlsx
    directory_open_dialog: false
    directory_var: directory
    directory_open_dialog_help: Выберите каталог
    directory_initial: null
    file_open_dialog: false
    file_var: file_path
    file_open_dialog_help: Выберите файл
    filetypes:
    - - All files
      - '*.*'
  comment: Определим рабочие каталоги и общие значения
- id: load_excel_1
  type: load_excel
  params:
    input_mode: latest
    directory: '@directory_sbs'
    pattern: '*.xlsx'
    recursive: false
    file_path: null
    sheet: 0
    header_mode: first_row
    start_row: 1
    usecols: ''
    dataframe: df_sbs
    dtype: str
    include_service_columns: true
    from_file_mode: fullpath
    date_file_mode: created
  comment: Ищем самую свежую выгрузку в каталоге от СБС и загружаем ее в df_1c
- id: load_excel_2
  type: load_excel
  params:
    input_mode: file
    directory: null
    pattern: '*.xlsx'
    recursive: false
    file_path: '@directory_work/Справочники/Настройки_для_контроля_остатков_склада.xlsx'
    sheet: Справочник Свод для МЦТП
    header_mode: first_row
    start_row: 1
    usecols: ''
    dataframe: df_spr_svod
    dtype: str
    include_service_columns: false
    from_file_mode: basename
    date_file_mode: created
  comment: Загружаем актуальные настройки из Настройки_для_контроля_остатков_склада
    справочник. Загружаем правила свертки номенклатуры 1c для МЦТП из листа Справочник
    Свод для МЦТП
- id: load_excel_3
  type: load_excel
  params:
    input_mode: file
    directory: null
    pattern: '*.xlsx'
    recursive: false
    file_path: '@directory_work/Справочники/Настройки_для_контроля_остатков_склада.xlsx'
    sheet: Справочник контроль позиций
    header_mode: first_row
    start_row: 1
    usecols: ''
    dataframe: df_spr_control
    dtype: str
    include_service_columns: false
    from_file_mode: basename
    date_file_mode: created
  comment: Загружаем актуальные настройки из Настройки_для_контроля_остатков_склада
    справочник. Загружаем настройки , какие позиции контролируем для МЦТП из листа  Справочник
    контроль позиций
- id: cast_column_type_1
  type: cast_column_type
  params:
    source_df: df_sbs
    column: Количество Остаток
    target_type: int
    errors_to_zero: true
    use_decimal_objects: false
  comment: Колонку остаток приведем к числу, для подсчета
- id: df_assign_3
  type: df_assign
  params:
    operation: drop_empty
    source_df: df_sbs
    target_df: df_sbs
    target_column: new_col
    source_column: OLD
    source_columns: []
    prefix: ''
    suffix: ''
    column_mode: names
    columns:
    - Код
    lookup_df: df_lookup
    source_key: ''
    lookup_key: ''
    lookup_value_column: ''
    subset: []
    how: any
    treat_whitespace_as_empty: true
    fill_value: _
    scope: all_columns
  comment: Все пустые значения номенклатуры -удаляем
- id: df_assign_1
  type: df_assign
  params:
    operation: fill_empty
    source_df: df_sbs
    target_df: df_sbs
    target_column: new_col
    source_column: OLD
    source_columns: []
    prefix: ''
    suffix: ''
    column_mode: names
    columns: []
    lookup_df: df_lookup
    source_key: ''
    lookup_key: ''
    lookup_value_column: ''
    subset: []
    how: any
    treat_whitespace_as_empty: true
    fill_value: _
    scope: all_columns
  comment: Во все пустые значения подставляем _
- id: groupby_aggregate_1
  type: groupby_aggregate
  params:
    source_df: df_sbs
    target_df: df_grouped
    group_keys:
    - Норма
    - Код
    aggregations: null
    named_aggregations:
      Номенклатура\Краткий текст материала:
        column: Номенклатура\Краткий текст материала
        func: max
      Количество Остаток:
        column: Количество Остаток
        func: sum
  comment: 'обновляем и формируем справочник свертки номенклатуры, по выгрузке формируем
    весь спектр номенклатуры и прикрепляем с низу актуального справочника. на следующем
    шаге выгрузим только уникальные записи, первые с верху (там будут старые настроенные
    и вновь появившиеся) '
- id: concat_dfs_1
  type: concat_dfs
  params:
    target_df: sprav
    dataframes:
    - df_spr_svod
    - df_grouped
    name_glob: ''
    axis: 0
    ignore_index: true
    join: outer
  comment: 'Склеим старые правила свертки и новые записи с номенклатурой. Прикрепляем
    с низу актуального справочника. на следующем шаге выгрузим только уникальные записи,
    первые с верху (там будут старые настроенные и вновь появившиеся) '
- id: sort_list_output_1
  type: sort_list_output
  params:
    source_df: sprav
    target_df: sprav
    sort: null
    list_filter: null
    unique_by_column:
    - Код
    duplicate_keep: first
  comment: 'Выгрузим только уникальные записи, берем первые с верху (там будут старые
    настроенные и вновь появившиеся) Что бы избежать неправильных расчетов выгружаем
    только уникальный код

    - Норма может меняться, но у нас останетсья старая, ее нужно будет править вручную'
- id: df_assign_2
  type: df_assign
  params:
    operation: fill_empty
    source_df: sprav
    target_df: sprav
    target_column: new_col
    source_column: OLD
    source_columns: []
    prefix: ''
    suffix: ''
    column_mode: names
    columns:
    - МЦТП
    lookup_df: df_lookup
    source_key: ''
    lookup_key: ''
    lookup_value_column: ''
    subset: []
    how: any
    treat_whitespace_as_empty: true
    fill_value: Не распределено
    scope: listed
  comment: Для вновь появившихся позиций номенклатуры СБС поставим признак не распределено
- id: sort_list_output_2
  type: sort_list_output
  params:
    source_df: sprav
    target_df: sprav
    sort:
    - Норма
    - МЦТП
    list_filter: {}
    unique_by_column: ''
    unique_by_columns: []
    duplicate_keep: first
  comment: 'Отсортируем, у нас обновленный справочник для группировки МЦТП готовый
    к применению и выгрузке  '
- id: merge_1
  type: merge
  params:
    left_df: df_sbs
    right_df: sprav
    how: left
    'on': []
    left_on:
    - Код
    right_on:
    - Код
    indicator: true
    suffixes:
    - _Sklad
    - _MCTP
    result_df: df_result
  comment: Разметим загруженные остатки СБС  , категориями групировки для МЦТП из
    справочника
- id: cast_column_type_4
  type: cast_column_type
  params:
    source_df: df_result
    column: Количество Остаток_Sklad
    target_type: int
    errors_to_zero: true
    use_decimal_objects: false
  comment: Колонку Количество Остаток_Sklad приведем к числу, для подсчета
- id: groupby_aggregate_2
  type: groupby_aggregate
  params:
    source_df: df_result
    target_df: df_grouped
    group_keys:
    - ГОСБ
    - ПВХ
    - Норма_MCTP
    - МЦТП
    - Качество
    - Статус
    aggregations: null
    named_aggregations:
      Остаток:
      - Количество Остаток_Sklad
      - sum
  comment: Сгруппируем и свернем номенклатуру остатков СБС по справочнику свертки
    МЦТП
- id: query_1
  type: query
  params:
    source_df: df_grouped
    target_df: df_god_sbs
    query_variables:
      quality:
      - Б/У
      - Новый
      status:
      - _
      - Рабочий
      - Новый
    query: Качество.isin(@quality) and Статус.isin(@status)
    column_reference: names
    string_filters: []
  comment: Создадим отдельную таблицу отфильтрованной техники пригодной к эксплуатации
- id: query_2
  type: query
  params:
    source_df: df_grouped
    target_df: df_bad_sbs
    query_variables:
      quality:
      - Б/У
      - Новый
      status:
      - _
      - Рабочий
      - Новый
    query: ~Статус.isin(@status)
    column_reference: names
    string_filters: []
  comment: Создадим отдельную таблицу отфильтрованной техники не пригодной к эксплуатации
- id: query_3
  type: query
  params:
    source_df: df_spr_control
    target_df: df_spr_control
    query_variables: null
    query: Контроль!='0' or Минимум!='0' or Максимум!='0'
    column_reference: names
    string_filters: []
  comment: Подготовим и обновим справочник контроля позиций. Удалим не актуальные
    строки из загруженного справочника в которых флаг контроля - 0 и в мин и мах -
    0. Не забываем, что там пока строковые значения
- id: groupby_aggregate_3
  type: groupby_aggregate
  params:
    source_df: df_grouped
    target_df: df_all_gosb_pf
    group_keys:
    - ПВХ
    aggregations: null
    named_aggregations:
      ГОСБ:
      - ГОСБ
      - max
      Контроль:
      - Остаток
      - count
  comment: Создадим промежуточный список всех ПФ СБС, для формирования справочника
    контроля остатков
- id: df_assign_4
  type: df_assign
  params:
    operation: concat_column
    source_df: df_all_gosb_pf
    target_df: df_all_gosb_pf
    target_column: Контроль
    source_column: null
    prefix: '0'
    suffix: ''
    column_mode: names
    columns: []
    lookup_df: df_lookup
    source_key: ''
    lookup_key: ''
    lookup_value_column: ''
    subset: []
    how: any
    treat_whitespace_as_empty: true
    fill_value: ''
    scope: listed
- id: cast_column_type_2
  type: cast_column_type
  params:
    source_df: df_all_gosb_pf
    column: Контроль
    target_type: int
    errors_to_zero: true
    use_decimal_objects: false
  comment: 'Что бы не было конфликта типов при объединении приведем колонку к значению
    INT '
- id: groupby_aggregate_4
  type: groupby_aggregate
  params:
    source_df: sprav
    target_df: df_all_norm_mctp
    group_keys:
    - Норма
    - МЦТП
    aggregations: null
    named_aggregations:
      Остаток:
        column: Количество Остаток
        func: count
      Контроль:
        column: Количество Остаток
        func: count
      Минимум:
        column: Количество Остаток
        func: count
      Максимум:
        column: Количество Остаток
        func: count
  comment: Создадим промежуточный список всех действующих норм свертки МЦТП, для формирования
    справочника контроля остатков
- id: merge_2
  type: merge
  params:
    left_df: df_all_gosb_pf
    right_df: df_all_norm_mctp
    how: outer
    'on':
    - Контроль
    left_on: []
    right_on: []
    indicator: false
    suffixes:
    - _x
    - _y
    result_df: sprav_cont
  comment: Формируем все возможные комбинации, для предзаполнения справочника контроля
    позиций
- id: concat_dfs_2
  type: concat_dfs
  params:
    target_df: df_spr_contr2
    dataframes:
    - df_spr_control
    - sprav_cont
    name_glob: ''
    axis: 0
    ignore_index: true
    join: inner
  comment: Объединяем загруженный и созданные справочник контроля позиций, что бы
    получить актуальный
- id: sort_list_output_3
  type: sort_list_output
  params:
    source_df: df_spr_contr2
    target_df: df_spr_control
    sort: null
    list_filter: null
    unique_by_column:
    - ГОСБ
    - ПВХ
    - Норма
    - МЦТП
    duplicate_keep: first
  comment: 'Выгрузим только уникальные записи, берем первые с верху (там будут старые
    настроенные и вновь появившиеся) '
- id: sort_list_output_4
  type: sort_list_output
  params:
    source_df: df_spr_control
    target_df: df_spr_control
    sort:
    - ГОСБ
    - ПВХ
    - Норма
    - МЦТП
    ascending: true
    list_filter: null
    unique_by_column: null
    duplicate_keep: first
  comment: Отсортируем по порядку подготовленный справочник
- id: save_excel_1
  type: save_excel
  params:
    source_df: df_spr_control
    columns: []
    template_path: '@directory_work/Справочники/Настройки_для_контроля_остатков_склада
      — Шаблон.xlsx'
    out_dir: '@directory_work/Справочники'
    filename: Настройки_для_контроля_остатков_склада.xlsx
    template_write_mode: overwrite
    template_column_map: {}
    sheet_name: Справочник контроль позиций
    start_row: 2
    start_col: 1
    split_by_column: null
    split_filename_mask: out_{group}.xlsx
  comment: 'Сохраним сформированныйt справочникb обратно

    Очистим и полность перезапишем справочник  Настройки_для_контроля_остатков_склада.xlsx

    с опцией template_write_mode: overwrite - создаст новый по шаблону.'
- id: save_excel_2
  type: save_excel
  params:
    source_df: sprav
    columns: []
    template_path: '@directory_work/Справочники/Настройки_для_контроля_остатков_склада
      — Шаблон.xlsx'
    out_dir: '@directory_work/Справочники'
    filename: Настройки_для_контроля_остатков_склада.xlsx
    template_write_mode: update
    template_column_map: {}
    sheet_name: Справочник Свод для МЦТП
    start_row: 2
    start_col: 1
    split_by_column: null
    split_filename_mask: out_{group}.xlsx
  comment: 'Сохраним сформированныйt справочник обратно

    Во  вновь созданный по шаблону справочник , допишем в   Настройки_для_контроля_остатков_склада.xlsx

    с опцией template_write_mode: overwrite - создаст новый по шаблону.'
- id: query_4
  type: query
  params:
    source_df: df_spr_control
    target_df: df_spr_control
    query_variables: null
    query: Контроль!='0' or Минимум!='0' or Максимум!='0'
    column_reference: names
    string_filters: []
  comment: Еще раз уже для работы Подготовим и обновим справочник контроля позиций.
    Удалим не актуальные строки из загруженного справочника в которых флаг контроля
    - 0 и в мин и мах - 0. Не забываем, что там пока строковые значения
- id: rename_columns_1
  type: rename_columns
  params:
    source_df: df_spr_control
    target_df: df_spr_control
    mapping:
      Норма: Норма_MCTP
  comment: Переименуем столбец для стыковки справочника норм и остатков СБС
- id: groupby_aggregate_6
  type: groupby_aggregate
  params:
    source_df: df_god_sbs
    target_df: df_god_sbs2
    group_keys:
    - ГОСБ
    - ПВХ
    - Норма_MCTP
    - МЦТП
    aggregations: null
    named_aggregations:
      Остаток:
      - Остаток
      - sum
  comment: Сгруппируем и свернем номенклатуру остатков СБС по справочнику свертки
    МЦТП без учета качества
- id: merge_3
  type: merge
  params:
    left_df: df_god_sbs
    right_df: df_spr_control
    how: outer
    'on': []
    left_on:
    - ГОСБ
    - ПВХ
    - Норма_MCTP
    - МЦТП
    right_on:
    - ГОСБ
    - ПВХ
    - Норма_MCTP
    - МЦТП
    indicator: false
    suffixes:
    - _x
    - _y
    result_df: df_good_sbs_contr
  comment: Связка доступных к использованию остатков на складе СБС с справочником
    контроля позиций
- id: drop_rows_1
  type: drop_rows
  params:
    source_df: df_good_sbs_contr
    target_df: df_good_sbs_contr
    mode: by_filter
    subset_columns: []
    keep: first
    query: Остаток.isna() and Контроль == 0
    column: ''
    values: []
- id: cast_column_type_3
  type: cast_column_type
  params:
    source_df: df_good_sbs_contr
    columns:
    - Остаток
    - Минимум
    - Контроль
    - Максимум
    target_type: int
    errors_to_zero: true
    use_decimal_objects: false
- id: groupby_aggregate_5
  type: groupby_aggregate
  params:
    source_df: df_sbs
    target_df: df_sbs_data
    group_keys:
    - _date_file
    - _from_file
    aggregations: null
    named_aggregations:
      _records:
      - _from_file
      - count
  comment: Подготовим сводку по загруженному файлу остатков 1-С СБС, в в следующем
    шаге выведем первую строчку шаблона
- id: df_assign_5
  type: df_assign
  params:
    operation: calc_column
    source_df: df_good_sbs_contr
    target_df: df_good_sbs_contr
    target_column: Отклонение от мин
    value_type: int
    calc_columns:
    - Минимум
    - Остаток
    - Контроль
    expression: (Остаток - Минимум)*Контроль
    source_column: OLD
    source_columns: []
    prefix: ''
    suffix: ''
    column_mode: names
    columns: []
    lookup_df: df_lookup
    source_key: ''
    lookup_key: ''
    lookup_value_column: ''
    subset: []
    how: any
    treat_whitespace_as_empty: true
    fill_value: ''
    scope: listed
- id: save_excel_4
  type: save_excel
  params:
    source_df: df_good_sbs_contr
    columns: []
    template_path: '@directory_work/Справочники/Анализ_остатков_склада-Шаблон.xlsx'
    out_dir: '@directory_out'
    filename: '@file_name_out'
    template_write_mode: overwrite
    template_column_map: {}
    sheet_name: Доступные остатки
    start_row: 3
    start_col: 1
    split_by_column: null
    split_filename_mask: out_{group}.xlsx
  comment: 'Сохраним сформированныйtотчет по шаблону

    Очистим и полность перезапишем отчет filename: Отчет_для_контроля_остатков_склада.xlsx

    с опцией template_write_mode: overwrite - создаст новый по шаблону.'
- id: save_excel_3
  type: save_excel
  params:
    source_df: df_bad_sbs
    columns: []
    template_path: '@directory_work/Справочники/Анализ_остатков_склада-Шаблон.xlsx'
    out_dir: '@directory_out'
    filename: '@file_name_out'
    template_write_mode: update
    template_column_map: {}
    sheet_name: Не используемое
    start_row: 3
    start_col: 1
    split_by_column: null
    split_filename_mask: out_{group}.xlsx
  comment: 'Запишем отчет о неиспользуемом оборудовании '
- id: save_excel_5
  type: save_excel
  params:
    source_df: df_sbs_data
    columns: []
    template_path: '@directory_work/Справочники/Анализ_остатков_склада-Шаблон.xlsx'
    out_dir: '@directory_out'
    filename: '@file_name_out'
    template_write_mode: update
    template_column_map: {}
    sheet_name: Доступные остатки
    start_row: 1
    start_col: 1
    split_by_column: null
    split_filename_mask: out_{group}.xlsx
  comment: Запишем инфо о файле отчета
- id: save_excel_6
  type: save_excel
  params:
