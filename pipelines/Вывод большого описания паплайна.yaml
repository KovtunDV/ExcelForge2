pipeline_version: 1
name: Вывод большого описания паплайна
description: "🌟 ##Почему выбирают нас?\n✔️ Качество и надежность: Мы работаем только с проверенными производителями, чтобы гарантировать долгий срок службы и стабильную работу.\n✔️ Широкий ассортимент: От процессоров и материнских плат до оперативной памяти и жестких дисков — у нас есть все, что нужно для сборки вашего идеального сервера.\n✔️ Конкурентные цены: Мы предлагаем лучшие цены на рынке, чтобы вы могли оптимизировать свои затраты без ущерба для качества.\n✔️ Профессиональная поддержка: Мы всегда готовы помочь вам выбрать подходящие комплектующие и ответить на все ваши вопросы.\nМы не только поставляем оборудование, но и консультируем, тестируем и гарантируем бесперебойную работу ваших серверов.\nНе упустите возможность приобрести качественные серверные комплектующие по выгодной цене!"
steps:
- id: load_excel_1
  type: load_excel
  params:
# Попробую эдесь сохранить комментарий
    input_mode: file
    directory: ''
    pattern: '*.xlsx'
    recursive: false
    file_path: C:/Результат.xlsx
    sheet: Лист1
    header_mode: first_row
    start_row: 1
    usecols: ''
    dataframe: df_main
    dtype: str
