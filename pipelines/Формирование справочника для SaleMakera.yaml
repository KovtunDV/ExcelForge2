pipeline_version: 1
name: Формирование справочника для SaleMakera
description: Из выгрузок РИТА, Оборотной ведомости УВХД, Реестра ПВХ МЦТП формирует
  справочник для использования в программе SaleMaker
steps:
- id: load_excel_1
  type: load_excel
  params:
    input_mode: file
    directory: ''
    pattern: '*.xlsx'
    recursive: false
    file_path: C:/Users/kovtu.CODER/ExcelForge/Демо_данные/rita.XLSX_depers.xlsx
    sheet: 0
    header_mode: first_row
    start_row: 1
    usecols: ''
    dataframe: rita
    dtype: str
  comment: Загружаем Рита
- id: filter_1
  type: drop_rows
  params:
    source_df: rita
    target_df: rita
    mode: by_filter
    expression:
      op: or
      items:
      - col: Серийный номер
        cmp: is_na
        value: ''
      - col: Серийный номер
        cmp: str_len
        value:
          op: <=
          n: 3
  comment: фильтруем нашу таблицу Рита, оставляем в ней только строки с полными серийными
    номерами >3 и не пустые (удаляем пустые и короткие серийные)
- id: load_excel_2
  type: load_excel
  params:
    input_mode: file
    directory: ''
    pattern: '*.xlsx'
    recursive: false
    file_path: C:/Users/kovtu.CODER/ExcelForge/Демо_данные/oborot.XLSX_depers.xlsx
    file_open_dialog: false
    file_open_dialog_help: Выберите файл для загрузки
    directory_open_dialog: false
    directory_open_dialog_help: Выберите каталог с файлами Excel
    sheet: 0
    header_mode: first_row
    start_row: 1
    usecols: ''
    dataframe: oborot
    dtype: str
  comment: Загружаем Оборотную ведомость УВХД
- id: df_assign_1
  type: df_assign
  params:
    operation: select_columns
    source_df: oborot
    target_df: oborot
    target_column: new_col
    source_column: OLD
    prefix: ''
    suffix: ''
    column_mode: names
    columns:
    - Основной номер основного средства
    - БУ / Остаточная стоим. на конец периода
    - Полное название основного средства
    lookup_df: df_lookup
    source_key: ''
    lookup_key: ''
    lookup_value_column: ''
  comment: Убираем лишние столбцы из oborot.xlsx что бы не мешали
- id: df_assign_3
  type: df_assign
  params:
    operation: drop_empty
    source_df: oborot
    target_df: oborot
    target_column: new_col
    source_column: OLD
    prefix: ''
    suffix: ''
    column_mode: names
    columns: []
    lookup_df: df_lookup
    source_key: ''
    lookup_key: ''
    lookup_value_column: ''
    subset:
    - Основной номер основного средства
    how: any
    treat_whitespace_as_empty: true
    fill_value: ''
    scope: listed
- id: merge_1
  type: merge
  params:
    left_df: rita
    right_df: oborot
    how: left
    'on': []
    left_on: Основное средство
    right_on: Основной номер основного средства
    indicator: true
    suffixes:
    - _x
    - _y
    result_df: df_merged
- id: df_assign_2
  type: df_assign
  params:
    operation: concat_column
    source_df: df_merged
    target_df: df_merged
    target_column: На балансе
    source_column: _merge
    prefix: OB
    suffix: ''
    column_mode: names
    columns: []
    lookup_df: df_lookup
    source_key: ''
    lookup_key: ''
    lookup_value_column: ''
  comment: Индикатор _merge объединения Рита с таблицей Оборот. Если значения в Оборот
    найдены в столюце _merge значение both если значение только в Рита то left_only.
    Эти значения нельзя изменить, поэтому перенесем их в новый столбец На балансе.
    добавив prefix OB. Затем столбец Индикатор _merge - нужно переименовать, что бы
    освободить имя индикатора для других слияний
- id: text_transform_1
  type: text_transform
  params:
    source_df: df_merged
    column: На балансе
    trim: true
    upper: false
    lower: false
    replace_map:
      OBleft_only: Внесистемный учет
      OBboth: На балансе
  comment: "столбец На балансе. заменим по соответствию значение OBleft_only заменится\
    \ на Внесистемный учет, \nа OBboth значению на  На балансе"
- id: rename_columns_2
  type: rename_columns
  params:
    source_df: df_merged
    target_df: df_merged
    mapping:
      _merge: _balans
  comment: Столбец Индикатор _merge - нужно переименовать, что бы освободить имя индикатора
    для других слияний
- id: load_excel_3
  type: load_excel
  params:
    input_mode: file
    directory: ''
    pattern: '*.xlsx'
    recursive: false
    file_path: C:/Users/kovtu.CODER/ExcelForge/Демо_данные/Реестр активов на ПВХ МЦТП
      55_5530_1.xlsx.xlsx
    file_open_dialog: false
    file_open_dialog_help: Выберите файл для загрузки
    directory_open_dialog: false
    directory_open_dialog_help: Выберите каталог с файлами Excel
    sheet: 0
    header_mode: first_row
    start_row: 15
    usecols: D:O
    dataframe: reest
    dtype: str
  comment: 'Теперь выберем реестр ИТ активов, для заполнения столбцов номеров наклеек
    и определения местоположения оборудования.

    В реестре нужные мне данные начинаются с 15 строк в столбцах с D по О'
- id: rename_columns_1
  type: rename_columns
  params:
    source_df: reest
    target_df: reest
    mapping:
      'Unnamed: 14': akt_ui
  comment: Переименуем для удобства работы нужные нам столбцы.
- id: merge_2
  type: merge
  params:
    left_df: reest
    right_df: df_merged
    how: outer
    'on': []
    left_on:
    - Серийный номер
    right_on:
    - Серийный номер
    indicator: true
    suffixes:
    - _x
    - _y
    result_df: output
  comment: 'Теперь сопоставим реестр ПВХ с обьединенным РИТА-Оборотка - по серийному.

    Важно ! Здесь в зависимости от типа объединения получим или только справочник
    с значениями что хранится на складе ПВХ МЦТП.

    или вся Рита Госба вне зависимости от места расположения оборудования. Но у них
    не будет номера наклейки.'
- id: text_transform_2
  type: text_transform
  params:
    source_df: output
    column: Вид актива (текст)
    trim: true
    upper: false
    lower: false
    replace_map:
      ИТ.Системный блок: ПК
      ИТ.МФУ: Принтер/МФУ/сканер
      ИТ.Принтер: Принтер/МФУ/сканер
      ИТ.Моноблок: Моноблок
      ИТ.ЖК-панель: ЖК-панель
      ИТ.Тонкий клиент: Неттоп
      ИТ.Монитор: Монитор
      ИТ.Сканер(оргтехника: Принтер/МФУ/сканер
      ИТ.Телефонные аппара: Телефон
      ИТ.Компьютер планшет: Планшетный компьютер Apple iPad
      ИТ.Неттоп: Неттоп
      ИТ.Ноутбук: Ноутбук
  comment: '# Переопределим значения Вид актива (текст) в соответствии с требованиями
    к продажам'
- id: text_transform_3
  type: text_transform
  params:
    source_df: output
    column: _merge
    trim: true
    upper: false
    lower: false
    replace_map:
      right_only: Отсутсвует в ПВХ МЦТП
      both: На складе
      left_only: Оборудование на ПВХ, нет в учете РИТА
- id: save_excel_1
  type: save_excel
  params:
    source_df: output
    out_dir: C:/Users/kovtu.CODER/ExcelForge/Демо_вывод/Сформированные отчеты
    filename: Справочник_SaleMaker.xlsx
    columns: []
    template_path: C:/Users/kovtu.CODER/ExcelForge/Демо_данные/Шаблон_для_SaleMakera.xlsx
    template_column_map:
      Номер по п/п на устройстве: 1
      akt_ui: 2
      Серийный номер: 4
      Инв.номер: 5
      Вид актива (текст): 3
      БУ / Остаточная стоим. на конец периода: 6
      Дата начала эксплуатации: 7
      Полное название основного средства: 10
      На балансе: 9
      _merge: 8
    sheet_name: Лист1
    start_row: 3
    start_col: 1
    split_by_column: null
    split_filename_mask: out_{group}.xlsx
  comment: выгружу что получилось, по шаблону, что бы сопоставить данные
